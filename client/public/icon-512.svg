<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Dark Forest Slate & Emerald -->
    <linearGradient id="bgCyberVault512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#062217" />
      <stop offset="60%" stop-color="#02140D" />
      <stop offset="100%" stop-color="#010805" />
    </linearGradient>

    <!-- Cyber Shield Outer Contour Glow -->
    <linearGradient id="neonRim512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3ECF8E" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Laser Etched Folds -->
    <linearGradient id="laserJade512" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="laserDeep512" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgCyberVault512)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="url(#neonRim512)" stroke-width="3" stroke-opacity="0.85"/>

  <!-- Subtle Shield Security Grid lines in background -->
  <g opacity="0.15" stroke="#3ECF8E" stroke-width="1.5">
    <circle cx="256" cy="256" r="140" fill="none" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="190" fill="none" stroke-dasharray="4 8"/>
  </g>

  <!-- Origami 'D' + Micro Vault Keypoint -->
  <g transform="translate(136, 126) scale(1.88)">
    <path d="M24 16 H48 V122 H24 Z" fill="url(#laserDeep512)"/>
    <path d="M48 16 H82 L64 42 H48 Z" fill="url(#laserJade512)"/>
    <path d="M82 16 C102 16 118 30 118 52 V86 C118 108 102 122 82 122 H48 L64 96 H80 C92 96 98 90 98 80 V58 C98 48 92 42 80 42 L82 16 Z" fill="url(#laserJade512)"/>
    <path d="M48 122 H82 L64 96 H48 Z" fill="url(#laserDeep512)"/>
    <path d="M82 16 L118 52 H82 Z" fill="#A7F3D0"/>

    <!-- Centered Security Core Dot -->
    <circle cx="80" cy="69" r="6" fill="#3ECF8E" opacity="0.95"/>
    <circle cx="80" cy="69" r="12" fill="none" stroke="#3ECF8E" stroke-width="1.5" opacity="0.5"/>

    <line x1="48" y1="16" x2="48" y2="122" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <line x1="82" y1="16" x2="118" y2="52" stroke="rgba(255,255,255,0.8)" stroke-width="2" />
  </g>
</svg>